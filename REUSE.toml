# Copyright and licence of the files that cannot carry, or do not carry, a
# notice of their own (https://reuse.software/). Each Go file names its
# licence in its first line and takes its copyright from here; the scripts,
# the commit hook, the workflows, the Dependabot configuration, the issue
# forms and CITATION.cff carry both in their own header comment.
# Every other file is listed below by path, so a file added later is
# covered only once it is listed or carries its own notice. The licence
# texts (LICENSE, LICENSES/ and third_party/LICENSE-THIRD-PARTY) are not
# files REUSE covers. `reuse lint` checks that every file is covered, and
# CI runs it (.github/workflows/public-hygiene.yml).
#
# Where more than one annotation matches a file, the last one applies.
version = 1

[[annotations]]
path = "**/*.go"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tzun, Inc."

[[annotations]]
path = [
  "CONTRIBUTING.md",
  "NOTICE",
  "README.md",
  "RELEASING.md",
  "SECURITY.md",
  ".github/pull_request_template.md",
  "go.mod",
  "go.sum",
  "publishers/publishers.json",
  "internal/rfc3161/testdata/openssl-tokens.json",
  "internal/rfc3161/testdata/testpki-edge-tokens.json",
  "internal/rfc3161/testdata/testpki-tokens.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tzun, Inc."
SPDX-License-Identifier = "BSD-3-Clause-Clear"

[[annotations]]
path = "testdata/vectors/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tzun, Inc."
SPDX-License-Identifier = "CC0-1.0"

# Third-party test data: a public timestamp authority's root certificate and
# a response it issued, each kept as published (the Sectigo root re-encoded
# as PEM) or as received.
# They are not Tzun's and are not under BSD-3-Clause-Clear or CC0-1.0;
# LICENSES/LicenseRef-Timestamp-Authority-Material.txt says what each file
# is, where it came from, and on what terms it is here.
[[annotations]]
path = [
  "internal/rfc3161/testdata/freetsa-root.pem",
  "internal/rfc3161/testdata/freetsa.tsr",
]
precedence = "override"
SPDX-FileCopyrightText = "Free TSA (www.freetsa.org)"
SPDX-License-Identifier = "LicenseRef-Timestamp-Authority-Material"

[[annotations]]
path = [
  "internal/rfc3161/testdata/sectigo-root-r46.pem",
  "internal/rfc3161/testdata/sectigo.tsr",
]
precedence = "override"
SPDX-FileCopyrightText = "Sectigo Limited"
SPDX-License-Identifier = "LicenseRef-Timestamp-Authority-Material"

# The Contributor Covenant, version 2.1, as its official repository
# published it under CC BY 4.0 (LICENSE.md at the same commit):
# https://github.com/EthicalSource/contributor_covenant/blob/192bcf8016ae3733e46ff7d1285f2f57152cc195/content/version/2/1/code_of_conduct.md
# It is kept as published, without the site's front matter, except for the
# contact address under Enforcement and a closing paragraph. It is not Tzun's
# and is not under BSD-3-Clause-Clear; that closing paragraph names its
# creator, its steward and its licence, whose text is LICENSES/CC-BY-4.0.txt.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant, created by Coraline Ada Ehmke and stewarded by the Organization for Ethical Source"
SPDX-License-Identifier = "CC-BY-4.0"
