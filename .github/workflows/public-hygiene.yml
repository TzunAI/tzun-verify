name: Public hygiene

# scripts/check-public-hygiene.sh on the tracked files, on the message of every
# commit a push or pull request adds, and on a pull request's title and body;
# and `reuse lint`, which requires every file's copyright and licence
# (REUSE.toml). It is a workflow of its own rather than a job of ci.yml for
# two reasons: ci.yml skips changes that touch only Markdown, which are the
# likeliest to need these checks, and a pull request's title and body change
# without a push (the edited event), which must not re-run or cancel the
# build and tests.
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: public hygiene
    # The same runner choice as ci.yml's check job.
    runs-on: ${{ github.event.repository.private && fromJSON(vars.TZUN_RUNNER_LABELS || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so every commit a push or pull request adds is
          # here to read.
          fetch-depth: 0
          persist-credentials: false

      - name: The check's own tests
        run: scripts/test-public-hygiene.sh

      - name: Tracked files
        if: ${{ !cancelled() }}
        run: scripts/check-public-hygiene.sh tree

      - name: Copyright and licence of every file (REUSE)
        if: ${{ !cancelled() }}
        # A file REUSE.toml does not list and that carries no notice of its
        # own fails here: a new non-Go file is listed there, and a new Go
        # file begins with its licence line. The tool is pinned by version.
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet --disable-pip-version-check 'reuse[charset-normalizer]==6.2.0'
          "$RUNNER_TEMP/reuse/bin/reuse" lint

      - name: Commit messages
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            # A new branch or tag, a forced push, or a manual run: every
            # commit the pushed ref reaches.
            range="$AFTER"
          fi
          echo "commits: $range"
          scripts/check-public-hygiene.sh commits "$range"

      - name: Pull request title and body
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # Passed in the environment, never written into the script.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | scripts/check-public-hygiene.sh text "pull request"
