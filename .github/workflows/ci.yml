name: CI

# Push CI runs on main and release/** only; a working branch costs nothing
# until it opens a pull request, which runs the same job on the same SHA.
# workflow_dispatch runs it on demand for any branch. A push that touches only
# Markdown runs nothing here, except Markdown under testdata/, which the tests
# pin; in `paths` a later pattern overrides an earlier one. A pull request
# always runs this workflow, so the check job, which branch protection
# requires, always reports: the changes job applies the same rule to the pull
# request's files, and the check job is skipped when only Markdown outside
# testdata/ changed. GitHub reports a skipped job as successful.
# public-hygiene.yml checks every change, Markdown included.
on:
  push:
    branches: [main, 'release/**']
    # A release tag runs the check job and the release gate below.
    tags: ['v*']
    paths: ['**', '!**/*.md', 'testdata/**']
  pull_request:
    branches: [main]
    # ready_for_review starts CI when a draft is marked ready; the check job
    # skips while the PR is a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; a new push supersedes the last, except on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  changes:
    # Whether a pull request changes only Markdown outside testdata/, by the
    # push filter's rule. Any other event counts as changing code. It reads
    # nothing from the event but the two commit ids.
    name: what the pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the base and head commits are both here.
          fetch-depth: 0
          persist-credentials: false

      - name: The files it changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # A failed git diff fails this step and sets no output, and the check
        # job then runs in full.
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            files="$(git diff --name-only --no-renames "$BASE...$HEAD")"
            docs_only=true
            while IFS= read -r f; do
              case "$f" in
                '') ;;
                testdata/*) docs_only=false ;;
                *.md) ;;
                *) docs_only=false ;;
              esac
            done <<<"$files"
          fi
          echo "only Markdown outside testdata/: $docs_only"
          echo "docs_only=$docs_only" >>"$GITHUB_OUTPUT"

  check:
    name: gofmt, vet, tests, no Tzun imports, reproducible build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skipped while the pull request is a draft, and when it changes only
    # Markdown outside testdata/. !cancelled() runs it in full when the
    # changes job failed, since a job skipped for a failed dependency would
    # also report success.
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain go.mod pins. The next step refuses any other.
          go-version: '1.27.1'
          cache-dependency-path: go.sum

      - name: Toolchain is the pinned one
        env:
          GOTOOLCHAIN: local
        run: |
          want="go$(sed -n 's/^toolchain go//p' go.mod)"
          got="$(go env GOVERSION)"
          echo "go.mod pins $want; runner has $got"
          test "$got" = "$want"

      - name: go.mod and go.sum are tidy
        # A dependency the code imports is never left marked indirect, and
        # nothing is required that the build does not use.
        run: go mod tidy -diff

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Tests (the vector corpus runner included)
        run: go test -count=1 ./...

      - name: Tests under the release build tags
        # A release is built with -tags purego (scripts/reproducible-build.sh),
        # which swaps gnark-crypto's assembly for Go; the suite runs on that
        # build too.
        run: go test -count=1 -tags purego ./...

      - name: No Tzun imports
        run: scripts/check-no-tzun-imports.sh

      - name: Licence line in every Go file
        run: scripts/check-spdx-headers.sh

      - name: Third-party licences are current
        # third_party/LICENSE-THIRD-PARTY holds the licence of every module
        # a release binary links; a release publishes it beside the binaries.
        run: scripts/third-party-licenses.sh --check

      - name: Reproducible build
        # Two clean builds of one target, each with its own tree path, build
        # cache and module cache, keep the job short; the release gate
        # rebuilds every target a release publishes. The SHA-256 printed here
        # is the one a rebuild on another machine must match.
        run: scripts/reproducible-build.sh linux/amd64

  release-gate:
    # Only for a release tag: every target's reproducible build and the
    # mutation tests (scripts/release-gate.sh). It reads nothing but this
    # repository.
    if: startsWith(github.ref, 'refs/tags/v')
    name: release gate
    # GitHub-hosted on purpose: a release's reproducible builds come from a
    # fresh VM. It runs once per release tag.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum

      - name: Release gate
        run: scripts/release-gate.sh
