# Dependabot version updates, once a week: the Go modules go.mod requires,
# and the actions the workflows use. Each ecosystem's minor and patch
# updates come in one pull request, and each major update in one of its own.
# An action is pinned to a commit with its version in a comment after it
# (`uses: owner/name@<sha> # v1.2.3`), and Dependabot rewrites both. Its
# commits are signed off with an address that the public hygiene check
# allows only in a commit Dependabot authored
# (scripts/check-public-hygiene.sh).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-modules:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: Dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: CI
